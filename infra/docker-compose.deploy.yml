# PayFlow deployment-oriented Compose (portfolio / local deploy smoke).
# Separate from infra/docker-compose.yml (dev infra with published DB/Redis ports).
#
# From repository root (after preparing secrets — see docs/SETUP.md):
#   docker compose -f infra/docker-compose.deploy.yml --env-file secrets/deploy-smoke/.env config
#   docker compose -f infra/docker-compose.deploy.yml --env-file secrets/deploy-smoke/.env up -d --build
#   docker compose -f infra/docker-compose.deploy.yml --env-file secrets/deploy-smoke/.env --profile kafka up -d
#
# Only the frontend publishes a host port. Postgres, Redis, and backend stay on the internal network.
# TLS is assumed at an outer reverse proxy in real deployments. Do not commit real secrets.

name: payflow-deploy

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - payflow_deploy_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - payflow_deploy_redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: payflow-backend:deploy
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      JWT_AUTO_GENERATE_KEYS: "false"
      JWT_ISSUER: ${JWT_ISSUER:-payflow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-payflow-api}
      API_KEY_HASH_PEPPER: ${API_KEY_HASH_PEPPER}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
      PAYFLOW_CORS_ALLOWED_ORIGINS: ${PAYFLOW_CORS_ALLOWED_ORIGINS}
      PAYFLOW_KAFKA_ENABLED: ${PAYFLOW_KAFKA_ENABLED:-false}
      PAYFLOW_KAFKA_CONSUMER_ENABLED: ${PAYFLOW_KAFKA_CONSUMER_ENABLED:-false}
      PAYFLOW_OUTBOX_PUBLISHER_ENABLED: ${PAYFLOW_OUTBOX_PUBLISHER_ENABLED:-false}
      PAYFLOW_WEBHOOK_DELIVERY_ENABLED: ${PAYFLOW_WEBHOOK_DELIVERY_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0 -Djava.security.egd=file:/dev/./urandom}
    volumes:
      - type: bind
        source: ${PAYFLOW_JWT_PRIVATE_KEY_FILE}
        target: /run/secrets/jwt-private.pem
        read_only: true
      - type: bind
        source: ${PAYFLOW_JWT_PUBLIC_KEY_FILE}
        target: /run/secrets/jwt-public.pem
        read_only: true
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: payflow-frontend:deploy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PAYFLOW_BACKEND_HOST: backend
      PAYFLOW_BACKEND_PORT: "8080"
    ports:
      - "127.0.0.1:${PAYFLOW_DEPLOY_HTTP_PORT:-18080}:8080"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - payflow_deploy_kafkadata:/var/lib/kafka/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

networks:
  internal:
    driver: bridge
    name: payflow_deploy_internal

volumes:
  payflow_deploy_pgdata:
  payflow_deploy_redisdata:
  payflow_deploy_kafkadata:
