spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

payflow:
  operations:
    metrics-refresh-enabled: false
  kafka:
    enabled: false
    consumer:
      enabled: false
  outbox:
    publisher:
      enabled: false
      scheduling-enabled: false
  webhooks:
    delivery:
      enabled: false
      scheduling-enabled: false
  security:
    jwt:
      auto-generate-keys: true
      private-key-path: ${java.io.tmpdir}/payflow-test-jwt-private.pem
      public-key-path: ${java.io.tmpdir}/payflow-test-jwt-public.pem
      access-token-ttl: 15m
      issuer: payflow-test
      audience: payflow-api-test
    refresh-token:
      ttl: 7d
    browser-session:
      cookie-secure: false
      cookie-same-site: Lax
    api-key:
      hash-pepper: test-api-key-pepper-not-for-production
    webhook:
      # Test-only AES-256 key (Base64 of "PayFlowTestWebhookEncKey_32bytes") — not for production.
      encryption-key-base64: UGF5Rmxvd1Rlc3RXZWJob29rRW5jS2V5XzMyYnl0ZXM=
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
    rate-limit:
      enabled: true
      auth-requests-per-minute: 1000
      fail-closed-when-redis-unavailable: true

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.payflow: INFO
