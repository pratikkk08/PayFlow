# Local development against Docker Compose (Postgres + Redis).

payflow:
  security:
    jwt:
      auto-generate-keys: true
      private-key-path: local-secrets/jwt-private.pem
      public-key-path: local-secrets/jwt-public.pem
    api-key:
      hash-pepper: ${API_KEY_HASH_PEPPER:local-dev-api-key-pepper-change-me}

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.payflow: DEBUG
    org.springframework.security: INFO
