spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

payflow:
  kafka:
    enabled: ${PAYFLOW_KAFKA_ENABLED:true}
  security:
    jwt:
      auto-generate-keys: false
    browser-session:
      cookie-secure: true
      cookie-same-site: Lax
    rate-limit:
      fail-closed-when-redis-unavailable: true

logging:
  level:
    root: INFO
    com.payflow: INFO
    org.springframework.security: WARN
